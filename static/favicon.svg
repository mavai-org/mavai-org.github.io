<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="rounded">
      <rect width="100" height="100" rx="12" ry="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Row 0 (top) -->
    <rect x="0" y="0" width="19" height="19" fill="#1c59cd"/>
    <rect x="20" y="0" width="19" height="19" fill="#2f7ddc"/>
    <rect x="40" y="0" width="19" height="19" fill="#4fa9ea"/>
    <rect x="60" y="0" width="19" height="19" fill="#8ccff4"/>
    <rect x="80" y="0" width="19" height="19" fill="#c6e9fb"/>

    <!-- Row 1 -->
    <rect x="0" y="20" width="19" height="19" fill="#0f2fae"/>
    <rect x="20" y="20" width="19" height="19" fill="#1c59cd"/>
    <rect x="40" y="20" width="19" height="19" fill="#2f7ddc"/>
    <rect x="60" y="20" width="19" height="19" fill="#4fa9ea"/>
    <rect x="80" y="20" width="19" height="19" fill="#8ccff4"/>

    <!-- Row 2 -->
    <rect x="0" y="40" width="19" height="19" fill="#0c1a80"/>
    <rect x="20" y="40" width="19" height="19" fill="#0f2fae"/>
    <rect x="40" y="40" width="19" height="19" fill="#1c59cd"/>
    <rect x="60" y="40" width="19" height="19" fill="#2f7ddc"/>
    <rect x="80" y="40" width="19" height="19" fill="#4fa9ea"/>

    <!-- Row 3 -->
    <rect x="0" y="60" width="19" height="19" fill="#0a0a4e"/>
    <rect x="20" y="60" width="19" height="19" fill="#0c1a80"/>
    <rect x="40" y="60" width="19" height="19" fill="#0f2fae"/>
    <rect x="60" y="60" width="19" height="19" fill="#1c59cd"/>
    <rect x="80" y="60" width="19" height="19" fill="#2f7ddc"/>

    <!-- Row 4 (bottom) -->
    <rect x="0" y="80" width="19" height="19" fill="#06011f"/>
    <rect x="20" y="80" width="19" height="19" fill="#0a0a4e"/>
    <rect x="40" y="80" width="19" height="19" fill="#0c1a80"/>
    <rect x="60" y="80" width="19" height="19" fill="#0f2fae"/>
    <rect x="80" y="80" width="19" height="19" fill="#1c59cd"/>
  </g>
</svg>
